<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>muxdeck</title>
<style>
  :root {
    --bg: #0b0e11;
    --bg-panel: #12161b;
    --bg-hover: #1a2027;
    --border: #232b33;
    --fg: #d7dde3;
    --fg-dim: #6b7681;
    --accent: #2dd4bf;
    --danger: #f87171;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; margin: 0; }
  /* iOS: the shell never scrolls, and the web view must not rubber-band */
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    position: fixed; inset: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "SF Mono", Menlo, Monaco, monospace;
    font-size: 15px;
    -webkit-text-size-adjust: 100%;
  }

  /* --- picker --- */
  #picker {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: calc(16px + var(--sat)) calc(24px + var(--sar)) calc(16px + var(--sab)) calc(24px + var(--sal));
  }
  #picker h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.04em; color: var(--accent); }
  #picker h1::before { content: "❯ "; color: var(--fg-dim); }
  #servers { display: flex; flex-direction: column; gap: 10px; width: min(420px, 100%); }
  #servers button.server, #cloud button.server {
    display: flex; align-items: baseline; gap: 12px;
    background: var(--bg-panel); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 18px; font: inherit; text-align: left; cursor: pointer;
  }
  #servers button.server:active, #cloud button.server:active { background: var(--bg-hover); border-color: var(--accent); }
  #servers .name, #cloud .name { font-weight: 600; }
  #servers .url, #cloud .url { color: var(--fg-dim); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #servers .rm { color: var(--fg-dim); padding: 0 2px; }
  #empty { color: var(--fg-dim); font-size: 13px; }
  #cloud { display: flex; flex-direction: column; gap: 10px; width: min(420px, 100%); }
  #cloud button.signin {
    background: var(--accent); color: #0b0e11; font: inherit; font-weight: 600;
    border: none; border-radius: 8px; padding: 14px 18px; cursor: pointer;
  }
  #cloud .who { display: flex; align-items: baseline; gap: 8px; color: var(--fg-dim); font-size: 12px; }
  #cloud .who .u { color: var(--fg); }
  #cloud .who button { background: none; border: none; color: var(--fg-dim); font: inherit; font-size: 12px; cursor: pointer; text-decoration: underline; margin-left: auto; padding: 0; }
  #cloud .daemons { color: var(--fg-dim); font-size: 12px; }
  form { display: flex; flex-direction: column; gap: 10px; width: min(420px, 100%); }
  form input {
    background: var(--bg-panel); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; font: inherit; font-size: 14px;
  }
  form input:focus { outline: none; border-color: var(--accent); }
  form input::placeholder { color: var(--fg-dim); }
  form button {
    background: var(--accent); color: #0b0e11; font: inherit; font-weight: 600;
    border: none; border-radius: 8px; padding: 12px; cursor: pointer;
  }
  #err { color: var(--danger); font-size: 13px; min-height: 1.2em; }

  /* --- connected view --- */
  #view {
    position: fixed; inset: 0; display: none;
    background: #000;
    /* the framed page cannot see env(safe-area-inset-*) itself, so the
       shell reserves every edge — bottom included, or the tmux status
       line lands under the home indicator */
    padding: var(--sat) var(--sar) var(--sab) var(--sal);
  }
  body.connected #view { display: block; }
  body.connected #picker { display: none; }
  #frame { width: 100%; height: 100%; border: none; background: #000; }
  #home {
    position: fixed;
    right: calc(10px + var(--sar));
    bottom: calc(10px + var(--sab));
    width: 34px; height: 34px; border-radius: 17px;
    background: rgba(18, 22, 27, 0.75);
    border: 1px solid var(--border);
    color: var(--fg-dim);
    font: inherit; font-size: 15px; line-height: 1;
    cursor: pointer;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  #home:active { color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
  <div id="picker">
    <h1>muxdeck</h1>
    <div id="cloud"></div>
    <div id="servers"></div>
    <form id="add">
      <input id="f-name" placeholder="name (e.g. lab)" autocapitalize="none" autocorrect="off" required>
      <input id="f-url" placeholder="server url (e.g. https://lab.example.com)" autocapitalize="none" autocorrect="off" inputmode="url" required>
      <button type="submit">add server</button>
    </form>
    <div id="err"></div>
  </div>
  <div id="view">
    <iframe id="frame" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
  </div>
  <button id="home" hidden title="servers">⌂</button>

<script>
  const KEY = "muxdeck-servers";
  const LAST = "muxdeck-last-server";
  const $ = (s) => document.querySelector(s);

  // --- muxdeck cloud: account-driven path (design: muxdeck-ios-store) ---
  // Sign-in happens in Safari (?app=1 handoff); the device token arrives
  // through the muxdeck:// deep link and lives here. Connecting is a
  // top-level form POST to the relay's cookie login.
  const CLOUD = "https://cloud.muxdeck.app";
  const CLOUD_KEY = "muxdeck-cloud-token";
  const T = window.__TAURI__;

  function cloudToken() { try { return localStorage.getItem(CLOUD_KEY); } catch { return null; } }
  function setCloudToken(t) { try { t ? localStorage.setItem(CLOUD_KEY, t) : localStorage.removeItem(CLOUD_KEY); } catch {} }

  async function openSignin() {
    const url = CLOUD + "/?app=1";
    try { await T.core.invoke("plugin:opener|open_url", { url }); }
    catch { window.open(url); }
  }

  function handleDeepLink(u) {
    // muxdeck://signin#token=mdd_...
    const m = /^muxdeck:\/\/signin#token=([A-Za-z0-9_]+)$/.exec(u);
    if (!m) return;
    setCloudToken(m[1]);
    renderCloud();
  }

  async function initDeepLink() {
    if (!T) return;
    try { ((await T.core.invoke("plugin:deep-link|get_current")) || []).forEach(handleDeepLink); } catch {}
    try { await T.event.listen("deep-link://new-url", (e) => (e.payload || []).forEach(handleDeepLink)); } catch {}
  }

  async function cloudApi(path, session, opts = {}) {
    const res = await fetch(CLOUD + path, {
      ...opts,
      headers: { "Content-Type": "application/json", ...(session ? { Authorization: "Bearer " + session } : {}) },
    });
    if (!res.ok) throw Object.assign(new Error("cloud " + res.status), { status: res.status });
    return res.status === 204 ? null : res.json();
  }

  function connectCloud(relayName) {
    const f = document.createElement("form");
    f.method = "post";
    f.action = "https://" + relayName + ".muxdeck.app/relay/login";
    const i = document.createElement("input");
    i.type = "hidden"; i.name = "token"; i.value = cloudToken();
    f.appendChild(i);
    document.body.appendChild(f);
    f.submit();
  }

  async function renderCloud() {
    const box = $("#cloud");
    box.innerHTML = "";
    if (!cloudToken()) {
      const b = document.createElement("button");
      b.className = "signin";
      b.textContent = "sign in with muxdeck cloud";
      b.addEventListener("click", openSignin);
      box.appendChild(b);
      return;
    }
    let acct, daemons;
    try {
      const { session } = await cloudApi("/api/session", null, { method: "POST", body: JSON.stringify({ token: cloudToken() }) });
      [acct, daemons] = await Promise.all([cloudApi("/api/account", session), cloudApi("/api/daemons", session)]);
    } catch (err) {
      if (err.status === 401) { setCloudToken(null); renderCloud(); return; }
      const d = document.createElement("div");
      d.className = "daemons";
      d.textContent = "cloud unreachable — will retry on next open";
      box.appendChild(d);
      return;
    }
    const b = document.createElement("button");
    b.className = "server";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = acct.relayName;
    const url = document.createElement("span");
    url.className = "url";
    url.textContent = "via muxdeck cloud";
    b.append(name, url);
    b.addEventListener("click", () => connectCloud(acct.relayName));
    box.appendChild(b);
    const who = document.createElement("div");
    who.className = "who";
    const u = document.createElement("span");
    u.className = "u";
    u.textContent = acct.username;
    const dm = document.createElement("span");
    dm.className = "daemons";
    const live = (daemons || []).map((d) => d.name || "daemon").join(", ");
    dm.textContent = live ? live : "no daemons claimed";
    const out = document.createElement("button");
    out.textContent = "sign out";
    out.addEventListener("click", async () => {
      try {
        const { session } = await cloudApi("/api/session", null, { method: "POST", body: JSON.stringify({ token: cloudToken() }) });
        await cloudApi("/api/signout", session, { method: "POST", body: JSON.stringify({ token: cloudToken() }) });
      } catch {}
      setCloudToken(null);
      renderCloud();
    });
    who.append(u, dm, out);
    box.appendChild(who);
  }

  function servers() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
  }
  function save(list) { localStorage.setItem(KEY, JSON.stringify(list)); }

  function render() {
    const box = $("#servers");
    box.innerHTML = "";
    const list = servers();
    if (!list.length) {
      const d = document.createElement("div");
      d.id = "empty";
      d.textContent = "no servers yet — add one below";
      box.appendChild(d);
      return;
    }
    for (const s of list) {
      const b = document.createElement("button");
      b.className = "server";
      b.type = "button";
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = s.name;
      const url = document.createElement("span");
      url.className = "url";
      url.textContent = s.url;
      const rm = document.createElement("span");
      rm.className = "rm";
      rm.textContent = "✕";
      rm.addEventListener("click", (e) => {
        e.stopPropagation();
        save(list.filter((x) => x.name !== s.name));
        render();
      });
      b.append(name, url, rm);
      b.addEventListener("click", () => connect(s));
      box.appendChild(b);
    }
  }

  function connect(s) {
    localStorage.setItem(LAST, s.name);
    $("#frame").src = s.url;
    document.body.classList.add("connected");
    $("#home").hidden = false;
  }

  function disconnect() {
    localStorage.removeItem(LAST);
    $("#frame").src = "about:blank";
    document.body.classList.remove("connected");
    $("#home").hidden = true;
    render();
  }

  $("#add").addEventListener("submit", (e) => {
    e.preventDefault();
    $("#err").textContent = "";
    const name = $("#f-name").value.trim();
    const url = $("#f-url").value.trim().replace(/\/+$/, "");
    if (!/^https?:\/\//.test(url)) { $("#err").textContent = "url must start with http:// or https://"; return; }
    if (!name) return;
    const list = servers().filter((x) => x.name !== name);
    list.push({ name, url });
    save(list);
    $("#f-name").value = "";
    $("#f-url").value = "";
    render();
  });

  $("#home").addEventListener("click", disconnect);

  render();
  renderCloud();
  initDeepLink();
  // Reopening the app drops you back into the last server you were on.
  const last = servers().find((s) => s.name === localStorage.getItem(LAST));
  if (last) connect(last);
</script>
</body>
</html>
