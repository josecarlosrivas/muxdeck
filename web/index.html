<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>muxdeck</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <h1>muxdeck</h1>
      <span class="hdr-tools">
        <button id="notify" title="Notify when an agent needs input" hidden>&#128276;</button>
        <button id="split" title="split view (side by side)">&#9707;</button>
        <button id="refresh" title="Refresh sessions">&#10227;</button>
      </span>
    </header>
    <ul id="sessions"></ul>
    <form id="new-session">
      <input id="new-name" placeholder="new session" pattern="[A-Za-z0-9_-]+" maxlength="64" required
             autocomplete="off" spellcheck="false">
      <button title="Create session">+</button>
    </form>
  </aside>
  <main id="term-wrap">
    <div id="keybar" hidden>
      <button data-key="&#x1b;">esc</button>
      <button data-key="&#x9;">tab</button>
      <button id="key-ctrl">ctrl</button>
      <button data-key="&#x1b;[A">&#8593;</button>
      <button data-key="&#x1b;[B">&#8595;</button>
      <button data-key="&#x1b;[D">&#8592;</button>
      <button data-key="&#x1b;[C">&#8594;</button>
      <button id="key-paste">paste</button>
      <button data-key="-">-</button>
      <button data-key="|">|</button>
      <button data-key="~">~</button>
      <button data-key="/">/</button>
    </div>
    <div id="panes"></div>
  </main>
</div>
<div id="switcher" hidden>
  <div class="sw-box">
    <input placeholder="switch session&hellip;" spellcheck="false" autocomplete="off">
    <ul></ul>
  </div>
</div>
<div id="login" hidden>
  <form id="login-form">
    <h2>muxdeck</h2>
    <input id="token" type="password" placeholder="access token" required autocomplete="current-password">
    <button>unlock</button>
    <p id="login-error" hidden>wrong token</p>
  </form>
</div>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="vendor/addon-search.js"></script>
<script src="vendor/addon-web-links.js"></script>
<script src="app.js"></script>
</body>
</html>
