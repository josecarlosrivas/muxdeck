<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>muxdeck</title>
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <h1>muxdeck</h1>
      <button id="refresh" title="Refresh sessions">&#10227;</button>
    </header>
    <ul id="sessions"></ul>
    <form id="new-session">
      <input id="new-name" placeholder="new session" pattern="[A-Za-z0-9_-]+" maxlength="64" required
             autocomplete="off" spellcheck="false">
      <button title="Create session">+</button>
    </form>
  </aside>
  <main id="term-wrap">
    <div id="placeholder">select or create a session</div>
    <div id="terminal" hidden></div>
  </main>
</div>
<div id="login" hidden>
  <form id="login-form">
    <h2>muxdeck</h2>
    <input id="token" type="password" placeholder="access token" required autocomplete="current-password">
    <button>unlock</button>
    <p id="login-error" hidden>wrong token</p>
  </form>
</div>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="app.js"></script>
</body>
</html>
