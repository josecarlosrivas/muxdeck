name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$RELEASE_TAG" \
              -o "dist/muxdeck-${target%/*}-${target#*/}" .
          done
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" dist/* --clobber

  desktop-dmg:
    runs-on: macos-latest
    needs: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Assert desktop version matches tag
        run: |
          v=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' desktop/src-tauri/tauri.conf.json | head -1)
          [ "v$v" = "$RELEASE_TAG" ] || { echo "tauri.conf.json is $v but tag is $RELEASE_TAG" >&2; exit 1; }
      - name: Build sidecar daemon
        run: desktop/build-sidecar.sh
      - name: Install desktop deps
        working-directory: desktop
        run: npm ci
      - name: Build signed app
        working-directory: desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: npx tauri build --bundles app
      - name: Package DMG
        run: desktop/make-dmg.sh
      - name: Notarize and staple distribution
        working-directory: desktop
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          if printf '%s' "$APPLE_API_KEY_CONTENT" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$key"
          else
            printf '%s' "$APPLE_API_KEY_CONTENT" | base64 --decode > "$key"
          fi
          dmg=$(ls muxdeck_*.dmg)
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          codesign --verify --verbose=2 "$dmg"
          hdiutil verify "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$key" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"
          app=src-tauri/target/release/bundle/macos/muxdeck.app
          xcrun stapler staple "$app"
      - name: Build updater artifact
        # Tarred from the stapled .app so auto-updated installs carry the
        # notarization ticket, then signed with the updater keypair (distinct
        # from Apple codesigning — the app's baked-in pubkey verifies this).
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          tar -C src-tauri/target/release/bundle/macos -czf muxdeck_aarch64.app.tar.gz muxdeck.app
          npx tauri signer sign muxdeck_aarch64.app.tar.gz
      - name: Publish updater manifest
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n \
            --arg version "${RELEASE_TAG#v}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$(cat muxdeck_aarch64.app.tar.gz.sig)" \
            --arg url "https://github.com/josecarlosrivas/muxdeck/releases/download/${RELEASE_TAG}/muxdeck_aarch64.app.tar.gz" \
            '{version: $version, pub_date: $date, platforms: {"darwin-aarch64": {signature: $sig, url: $url}}}' \
            > latest.json
          gh release upload "$RELEASE_TAG" muxdeck_aarch64.app.tar.gz muxdeck_aarch64.app.tar.gz.sig latest.json --clobber
      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg=$(ls desktop/muxdeck_*.dmg)
          cp "$dmg" muxdeck_macos_arm64.dmg
          gh release upload "$RELEASE_TAG" "$dmg" muxdeck_macos_arm64.dmg --clobber
