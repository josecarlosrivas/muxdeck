name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" \
              -o "dist/muxdeck-${target%/*}-${target#*/}" .
          done
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

  desktop-dmg:
    runs-on: macos-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert desktop version matches tag
        run: |
          v=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' desktop/src-tauri/tauri.conf.json | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tauri.conf.json is $v but tag is $GITHUB_REF_NAME" >&2; exit 1; }
      - name: Build sidecar daemon
        run: desktop/build-sidecar.sh
      - name: Install desktop deps
        working-directory: desktop
        run: npm ci
      - name: Build signed app
        working-directory: desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: npx tauri build --bundles app
      - name: Notarize and staple app
        # Stapling the .app itself (not just the DMG) lets Gatekeeper verify
        # the dragged-out app offline on first launch.
        working-directory: desktop
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          if printf '%s' "$APPLE_API_KEY_CONTENT" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$key"
          else
            printf '%s' "$APPLE_API_KEY_CONTENT" | base64 --decode > "$key"
          fi
          app=src-tauri/target/release/bundle/macos/muxdeck.app
          ditto -c -k --keepParent "$app" muxdeck-app.zip
          xcrun notarytool submit muxdeck-app.zip \
            --key "$key" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$app"
          rm muxdeck-app.zip
      - name: Package DMG
        run: desktop/make-dmg.sh
      - name: Notarize and staple DMG
        working-directory: desktop
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun notarytool submit muxdeck_*.dmg \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple muxdeck_*.dmg
      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg=$(ls desktop/muxdeck_*.dmg)
          cp "$dmg" muxdeck_macos_arm64.dmg
          gh release upload "$GITHUB_REF_NAME" "$dmg" muxdeck_macos_arm64.dmg
