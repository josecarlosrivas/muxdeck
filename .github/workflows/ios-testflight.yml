name: ios-testflight

on:
  workflow_dispatch:

jobs:
  build-upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install iOS Rust targets
        run: rustup target add aarch64-apple-ios
      - name: Install desktop deps
        working-directory: desktop
        run: npm ci
      - name: Write App Store Connect API key
        # ASC_* secrets hold the App Manager ASC key used for signing and
        # TestFlight upload; the APPLE_API_* secrets remain the Developer-role
        # notarization key used by the desktop release workflow.
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          if printf '%s' "$APPLE_API_KEY_CONTENT" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$key"
          else
            printf '%s' "$APPLE_API_KEY_CONTENT" | base64 --decode > "$key"
          fi
      - name: Stamp version and unique build number
        # TestFlight rejects re-used CFBundleVersion values, so each CI run
        # gets its own. The marketing version is derived from
        # tauri.conf.json rather than trusted from the committed generated
        # plist, which has no other writer and drifts silently.
        run: |
          plist=desktop/src-tauri/gen/apple/muxdeck-desktop_iOS/Info.plist
          version=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          plutil -replace CFBundleShortVersionString -string "$version" "$plist"
          plutil -replace CFBundleVersion -string "${GITHUB_RUN_NUMBER}" "$plist"
      - name: Build signed IPA
        working-directory: desktop
        env:
          APPLE_API_ISSUER: ${{ secrets.ASC_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.ASC_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: npx tauri ios build --export-method app-store-connect
      - name: Verify the built IPA identity
        # Gates the upload. Stamping the source plist proves nothing about
        # what shipped: `tauri ios build` may re-sync version fields from
        # tauri.conf.json, which would clobber the build number stamped
        # above and collide on the next run. Reading the values back out of
        # the IPA is agnostic to whether it does. Bundle id is asserted here
        # too because it lives ONLY in the committed generated xcodeproj
        # (PRODUCT_BUNDLE_IDENTIFIER, set by hand) and would regress to
        # tauri.conf.json's identifier if `tauri ios init` were re-run.
        run: |
          ipa=$(find desktop/src-tauri/gen/apple/build -name '*.ipa' | head -1)
          [ -n "$ipa" ] || { echo "no ipa produced" >&2; exit 1; }
          echo "ipa=$ipa" >> "$GITHUB_ENV"

          work="$RUNNER_TEMP/ipa-verify"
          rm -rf "$work" && mkdir -p "$work"
          unzip -q "$ipa" -d "$work"
          app=$(find "$work/Payload" -maxdepth 1 -name '*.app' | head -1)
          [ -n "$app" ] || { echo "no .app inside $ipa" >&2; exit 1; }
          built="$app/Info.plist"

          read_key() { plutil -extract "$1" raw -o - "$built"; }
          got_version=$(read_key CFBundleShortVersionString)
          got_build=$(read_key CFBundleVersion)
          got_id=$(read_key CFBundleIdentifier)

          want_version=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          want_build="${GITHUB_RUN_NUMBER}"
          want_id=com.josecarlosrivas.muxdeck

          echo "built: $got_id $got_version ($got_build)"
          echo "want:  $want_id $want_version ($want_build)"

          fail=0
          [ "$got_version" = "$want_version" ] || { echo "::error::marketing version is $got_version, expected $want_version"; fail=1; }
          [ "$got_build" = "$want_build" ] || { echo "::error::build number is $got_build, expected $want_build — tauri likely re-synced the plist after the stamp step; stamp after the build or set it via xcodebuild"; fail=1; }
          [ "$got_id" = "$want_id" ] || { echo "::error::bundle id is $got_id, expected $want_id"; fail=1; }
          exit $fail
      - name: Upload to TestFlight
        env:
          APPLE_API_ISSUER: ${{ secrets.ASC_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p private_keys
          cp "$RUNNER_TEMP/AuthKey.p8" "private_keys/AuthKey_${APPLE_API_KEY}.p8"
          # $ipa comes from the verify step, so the uploaded file is the
          # exact one whose identity was checked.
          xcrun altool --upload-app --type ios -f "$ipa" \
            --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: muxdeck-ios
          path: desktop/src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: ignore
